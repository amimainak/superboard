<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superboard — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #09090b;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .logo {
      width: 56px; height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #059669, #0891b2);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 24px; font-weight: 700; color: #fff;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #f4f4f5; }
    p { font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 24px; }
    button {
      padding: 10px 24px;
      border-radius: 10px;
      border: none;
      background: #059669;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #047857; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">S</div>
    <h1>You're Offline</h1>
    <p>Superboard requires an internet connection. Please check your connection and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
