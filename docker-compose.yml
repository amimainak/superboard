# ============================================================
# Superboard — Local Development Docker Compose
# ============================================================
# Usage: docker compose up --build
# This mirrors production: Caddy (TLS+proxy) + Next.js + Hocuspocus
# ============================================================

services:
  # ---- Next.js Application ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - NEXT_PUBLIC_HOCUSPOCUS_URL=ws://hocuspocus:3001
    ports:
      - "3000:3000"
    depends_on:
      hocuspocus:
        condition: service_healthy
    restart: unless-stopped
    # SECURITY: Read-only root filesystem with tmpfs for writable dirs
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    # SECURITY FIX (RT-M04): Resource limits to prevent resource exhaustion
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
          pids: 256  # SECURITY: Limit process fork bombs

  # ---- Hocuspocus CRDT Server ----
  hocuspocus:
    build:
      context: .
      dockerfile: Dockerfile.hocuspocus
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - PORT=3001
    # SECURITY FIX (RT-M05): Port only accessible internally via Docker network through Caddy
    # ports:
    #   - "3001:3001"
    restart: unless-stopped
    # SECURITY FIX (RT-M04): Resource limits for hocuspocus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
          pids: 128  # SECURITY: Limit process fork bombs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp

  # ---- Caddy Reverse Proxy ----
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    # SECURITY: Drop all capabilities except network binding
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    # SECURITY FIX (RT-M04): Resource limits for Caddy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 64

volumes:
  caddy_data:
  caddy_config:
